    <style>
      html.splashing { overflow: hidden; }
      #splash {
        --red: #ee3345; --ink: #231f20;
        --mx: 50%; --my: 42%;
        --e: cubic-bezier(0.23, 1, 0.32, 1);
        --io: cubic-bezier(0.77, 0, 0.175, 1);
        position: fixed; inset: 0; z-index: 1000;
        display: grid; place-items: center;
        background: var(--red); color: #fff;
        font-family: 'Noto Sans', 'Segoe UI', sans-serif;
        /* the whole red screen is slurped into the mouth at the end */
        clip-path: circle(150vmax at var(--mx) var(--my));
        animation: sp-collapse 600ms var(--io) 2250ms forwards;
      }
      #splash > * { grid-area: 1 / 1; }
      .sp-card { display: grid; justify-items: center; gap: 18px;
        animation: sp-in 500ms var(--e) both, sp-out 300ms ease-in 800ms forwards; }
      .sp-logo { width: min(64vw, 380px); height: auto; }
      .sp-line { margin: 0; font-weight: 700; font-size: 15px; }
      .sp-scene { width: min(70vw, 52vh, 380px); height: auto; overflow: visible;
        animation: sp-scene 450ms var(--e) 850ms both; }
      .sp-bowl { animation: sp-rise 550ms var(--e) 850ms both; }
      .sp-n { stroke-dasharray: 1 1;
        animation: sp-pull 800ms cubic-bezier(0.55, 0, 0.3, 1) calc(1250ms + var(--i) * 45ms) both; }
      .sp-noodles { animation: sp-wiggle 120ms ease-in-out 1250ms 7 alternate both; }
      .sp-face { transform-box: fill-box; transform-origin: 50% 80%;
        animation: sp-puff 800ms var(--e) 1250ms both, sp-gulp 240ms ease-out 2080ms both; }
      .sp-steam path { animation: sp-steam 1400ms ease-in-out 850ms infinite both; }
      .sp-steam path + path { animation-delay: 1250ms; }
      .sp-skip { align-self: end; margin-bottom: max(28px, env(safe-area-inset-bottom));
        background: none; border: 0; color: #fff; font-family: inherit; font-weight: 700;
        font-size: 14px; line-height: 1; text-decoration: underline; text-underline-offset: 4px;
        padding: 12px 16px; cursor: pointer; animation: sp-in 400ms var(--e) 300ms both; }
      #splash.sp-skipping { animation: sp-collapse 420ms var(--io) forwards; }
      #splash.sp-skipping .sp-skip { visibility: hidden; }

      @keyframes sp-in { from { opacity: 0; transform: translateY(14px) scale(0.97); } }
      @keyframes sp-out { to { opacity: 0; transform: translateY(-18px) scale(0.98); visibility: hidden; } }
      @keyframes sp-scene { from { opacity: 0; } }
      @keyframes sp-rise { from { transform: translateY(70px); } }
      @keyframes sp-pull { to { stroke-dashoffset: 1; } }
      @keyframes sp-wiggle { from { transform: translateX(-3px); } to { transform: translateX(3px); } }
      @keyframes sp-puff { 60%, 100% { transform: scale(1.05, 1.03); } }
      @keyframes sp-gulp { 0% { transform: scale(1.05, 1.03); } 50% { transform: scale(0.97, 1.06); } 100% { transform: scale(1); } }
      @keyframes sp-steam { 0% { opacity: 0; transform: translateY(8px); } 40% { opacity: 0.8; } 100% { opacity: 0; transform: translateY(-22px); } }
      @keyframes sp-collapse { to { clip-path: circle(0px at var(--mx) var(--my)); visibility: hidden; } }
      @keyframes sp-fade { to { opacity: 0; visibility: hidden; } }

      /* Reduced motion: the card, then a plain fade. No slurp, no collapse. */
      @media (prefers-reduced-motion: reduce) {
        #splash, #splash.sp-skipping { clip-path: none; animation: sp-fade 250ms ease 700ms forwards; }
        .sp-card { animation: none; }
        .sp-scene { display: none; }
      }
    </style>

    <script>
      (function () {
        var s = document.getElementById('splash'), h = document.documentElement, done = false;
        if (!s) return;
        // Aim the final collapse at the mouth, wherever it lands at this size.
        function place() {
          var m = document.getElementById('sp-mouth').getBoundingClientRect();
          if (!m.width) return;
          s.style.setProperty('--mx', m.left + m.width / 2 + 'px');
          s.style.setProperty('--my', m.top + m.height / 2 + 'px');
        }
        function onKey(e) {
          if (e.key === 'Escape' || e.key === 'Enter' || e.key === ' ') skip();
        }
        function skip() { place(); s.classList.add('sp-skipping'); }
        function finish() {
          if (done) return;
          done = true;
          s.remove();
          h.classList.remove('splashing');
          removeEventListener('resize', place);
          removeEventListener('keydown', onKey);
          var t = location.hash && document.getElementById(location.hash.slice(1));
          if (t) t.scrollIntoView();
        }
        place();
        addEventListener('resize', place);
        addEventListener('keydown', onKey);
        s.addEventListener('click', skip);
        s.addEventListener('animationend', function (e) { if (e.target === s) finish(); });
        setTimeout(finish, 5000); // never trap the page if an animation event is missed
      })();
    </script>
